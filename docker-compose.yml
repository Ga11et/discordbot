version: "3.9"

services:
  postgres:
    container_name: discordbot-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discordbot_db}
      POSTGRES_USER: ${POSTGRES_USER:-discordbot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discordbot_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres_test:
    container_name: discordbot-postgres-test
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-discordbot_db_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-discordbot_user_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-discordbot_pass_test}
    ports:
      - "${POSTGRES_TEST_PORT:-55432}:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  postgres-test-data:
